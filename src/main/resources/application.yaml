spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://host.docker.internal:5432/odonto_house}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: idp_dental
        format_sql: true

    show-sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8085

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dGhpcy1pc19hX3NlY3JldF9rZXlfZm9yX3NhbXBsZS11c2FnZS1wbGVhc2Uta2VlcC1pdC1zZWNyZXQ=}
  expiration: ${JWT_EXPIRATION:86400000}